version: '3.9'

services:
  redis:
    image: redis:6.2-alpine
    restart: always
    container_name: redis
    ports:
      - 6379:6379
    networks:
      - bot
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15.1-alpine
    container_name: postgres
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - bot
    volumes:
      - local_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    ports:
      - 8080:80
    networks:
      - bot
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  bot:
    build: .
    command: "python main.py"
    container_name: referral-bot
    ports:
      - 443:443
    restart: always
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
    networks:
      - bot
    volumes:
      - .:/bot
    deploy:
      resources:
        limits:
          memory: 4g

networks:
  bot:
    driver: bridge

volumes:
  local_pgdata:
  pgadmin-data: